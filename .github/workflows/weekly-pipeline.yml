name: Weekly pipeline

on:
  schedule:
    # 每周一北京时间早上 8 点 = 周一 UTC 00:00
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      week:
        description: '回补的周次（周一日期，如 2026-09-14；留空 = 自动用上一个完整周）'
        type: string
        required: false
        default: ''
      send:
        description: '是否发送周刊邮件（回补历史数据时选 false）'
        type: boolean
        required: false
        default: true

# 需要写权限：把 data/prod.db 提交回仓库
permissions:
  contents: write

# 同组只允许一个在跑，其余排队（防止多次回补并发提交、数据打架）
concurrency:
  group: weekly-pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Prepare database
        env:
          DATABASE_URL: file:./data/prod.db
        run: |
          mkdir -p data
          npx prisma db push --skip-generate
          npx prisma generate

      - name: Run pipeline
        env:
          DATABASE_URL: file:./data/prod.db
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'deepseek' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_FROM: ${{ vars.NEWSLETTER_FROM }}
          SITE_URL: ${{ vars.SITE_URL || 'http://localhost:3000' }}
        run: |
          ARGS=""
          if [ -n "${{ inputs.week }}" ]; then ARGS="$ARGS --week=${{ inputs.week }}"; fi
          SEND="${{ github.event_name == 'schedule' || inputs.send == 'true' }}"
          if [ "$SEND" = "true" ]; then ARGS="$ARGS --send"; fi
          npx tsx scripts/run-pipeline.ts $ARGS

      - name: Commit database back
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/prod.db ]; then
            git add data/prod.db
            if git diff --cached --quiet; then
              echo "数据库无变化，跳过提交"
            else
              git commit -m "chore: 流水线数据 $(date -u +%F)"
              git push
            fi
          else
            echo "data/prod.db 不存在，跳过提交"
          fi
