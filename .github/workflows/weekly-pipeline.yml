name: Weekly pipeline

on:
  schedule:
    # Mondays at 13:00 UTC
    - cron: '0 13 * * 1'
  workflow_dispatch:
    inputs:
      send:
        description: 'Email subscribers after generating the issue'
        type: boolean
        default: false
      limit:
        description: 'Number of trending repos to analyze'
        type: string
        default: '10'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - name: Prepare database
        env:
          DATABASE_URL: file:./data/prod.db
        run: |
          mkdir -p data
          npx prisma db push --skip-generate
          npx prisma generate

      - name: Run pipeline
        env:
          DATABASE_URL: file:./data/prod.db
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # GH_PAT (a fine-grained PAT) gets the 5000 req/hr limit; the
          # workflow's built-in token works too if the secret is absent.
          GITHUB_TOKEN: ${{ secrets.GH_PAT || secrets.GITHUB_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NEWSLETTER_FROM: ${{ vars.NEWSLETTER_FROM }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          ARGS="--limit ${{ inputs.limit || '10' }}"
          if [ "${{ inputs.send || 'true' }}" = "true" ]; then ARGS="$ARGS --send"; fi
          npx tsx scripts/run-pipeline.ts $ARGS

      # SQLite lives on the runner, so the generated content is uploaded rather
      # than persisted. Swap DATABASE_URL to a hosted Postgres to keep history.
      - name: Upload database artifact
        uses: actions/upload-artifact@v4
        with:
          name: learn-from-github-db
          path: data/prod.db
          retention-days: 30
